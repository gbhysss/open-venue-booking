# Isolated CI overrides. Never use this file for a real deployment.
services:
  db:
    environment:
      POSTGRES_DB: openvenue_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openvenue -d openvenue_test"]
    ports: ["127.0.0.1:5432:5432"]
  app:
    environment:
      DATABASE_URL: postgresql://openvenue:${POSTGRES_PASSWORD}@db:5432/openvenue_test
      BOOKING_MAX_PER_MINUTE: '20'
  maintenance:
    environment:
      DATABASE_URL: postgresql://openvenue:${POSTGRES_PASSWORD}@db:5432/openvenue_test
