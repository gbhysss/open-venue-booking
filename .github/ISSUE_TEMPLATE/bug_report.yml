name: Bug report / 问题报告
description: Report a reproducible installation or application problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting / 提交前确认
      options:
        - label: I removed credentials, private tracking links and real applicant data.
          required: true
  - type: input
    id: version
    attributes:
      label: Version or commit / 版本或提交
      placeholder: v0.2.2
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: OS and architecture, Docker/Compose or Node/PostgreSQL versions, fresh install or upgrade.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Use fictional data and list the smallest sequence that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior / 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots / 脱敏日志或截图
      description: Do not paste .env files, session cookies, database URLs or private tracking tokens.
